# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # asset('assets/…', 'vite') : URL hashée d'un fichier buildé par Vite (ex. preload des polices)
    assets:
        packages:
            vite:
                version_strategy: 'Pentatrion\ViteBundle\Asset\ViteAssetVersionStrategy'

    # formulaire public d'avis : quelques envois par heure et par IP
    rate_limiter:
        review_form:
            policy: fixed_window
            limit: 3
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
