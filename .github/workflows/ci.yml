name: CI

on:
    push:
    pull_request:

jobs:
    front:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            # types TypeScript : ni Vite ni Vitest ne les vérifient
            - run: npm run typecheck
            - run: npx vitest run

    back:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # installe PHP (8.4 : la version minimale de composer.json, comme en prod)
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none

            # installe Node
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: composer install --no-interaction --no-progress
            - run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - run: npm ci
            # sans le build, Twig ne trouve pas entrypoints.json → tests en 500
            - run: npm run build
            - run: php bin/phpunit

    ssh-check:
        # ne tourne que si la CI est verte
        needs: [front, back]
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: installe la clé SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            # ConnectTimeout : si o2switch bloque l'IP, on échoue en 15 s au lieu d'attendre
            - run: ssh -o ConnectTimeout=15 ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} 'echo ok'
