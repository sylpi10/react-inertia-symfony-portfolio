name: CI

on:
    push:
    pull_request:
    # bouton "Run workflow" dans l'onglet Actions
    workflow_dispatch:
        inputs:
            dry_run:
                description: "dry run : affiche ce qui partirait, sans rien envoyer"
                type: boolean
                default: true

jobs:
    front:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            # types TypeScript : ni Vite ni Vitest ne les vérifient
            - run: npm run typecheck
            - run: npx vitest run

    back:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # installe PHP (8.4 : la version minimale de composer.json, comme en prod)
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none

            # installe Node
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: composer install --no-interaction --no-progress
            - run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - run: npm ci
            # sans le build, Twig ne trouve pas entrypoints.json → tests en 500
            - run: npm run build
            - run: php bin/phpunit

    deploy:
        needs: [front, back]
        # seulement au clic sur le bouton, et seulement depuis master
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        environment: production
        # jamais deux déploiements en même temps
        concurrency: production
        timeout-minutes: 10
        env:
            SERVER_USER: ${{ vars.SERVER_USER }}
            SERVER_HOST: ${{ vars.SERVER_HOST }}
            APP_PATH: ${{ vars.APP_PATH }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: make build

            # 2 steps "installe la clé SSH" et "autorise l'IP du runner", sans changement ...

            - name: rsync à blanc
              if: inputs.dry_run
              run: make sync RSYNC_DRY=--dry-run

            - name: déploie
              if: ${{ !inputs.dry_run }}
              run: make backup sync remote
